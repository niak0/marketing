<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
{{FONT_FACES}}
<style>
  :root {
    --blue: #0370FB;
    --orange: #FD7201;
    --ink: #FFFFFF;
    --soft: #93A1B8;
    --bg: #060E1C;
    --ring: rgba(3, 112, 251, 0.30);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    position: relative;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Signature: yayılan yakınlık halkaları */
  .rings {
    position: absolute;
    top: 232px;
    right: -300px;
    width: 1240px;
    height: 1240px;
    z-index: 0;
  }

  .rings div {
    position: absolute;
    border: 1.5px solid var(--ring);
    border-radius: 50%;
    inset: 0;
    margin: auto;
  }

  .r1 { width: 250px; height: 250px; }
  .r2 { width: 520px; height: 520px; opacity: 0.72; }
  .r3 { width: 810px; height: 810px; opacity: 0.46; }
  .r4 { width: 1120px; height: 1120px; opacity: 0.24; }

  .glow {
    position: absolute;
    top: 560px;
    right: -180px;
    width: 780px;
    height: 780px;
    border-radius: 50%;
    background: radial-gradient(
      circle,
      rgba(3, 112, 251, 0.28) 0%,
      transparent 66%
    );
    z-index: 0;
  }

  .photo {
    position: absolute;
    top: 0;
    right: 0;
    width: 700px;
    height: 640px;
    object-fit: cover;
    z-index: 1;
    -webkit-mask-image:
      radial-gradient(120% 120% at 100% 0%, #000 34%, transparent 78%),
      linear-gradient(to right, transparent 0%, #000 34%);
    -webkit-mask-composite: source-in;
    mask-composite: intersect;
    opacity: 0.9;
  }

  .stage {
    position: relative;
    z-index: 3;
    height: 100%;
    padding: 74px 74px 64px;
    display: flex;
    flex-direction: column;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand img { width: 54px; height: 54px; }

  .brand-name {
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.03em;
  }

  .brand-name i { color: var(--orange); font-style: normal; }

  .kicker {
    margin-top: 92px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    align-self: flex-start;
    padding: 12px 22px 12px 16px;
    border: 1.5px solid rgba(3, 112, 251, 0.55);
    border-radius: 999px;
    font-size: 23px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: #BFD4FF;
    background: rgba(3, 112, 251, 0.10);
  }

  .kicker svg { width: 22px; height: 22px; }

  h1 {
    margin-top: 30px;
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 108px;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.045em;
    max-width: 700px;
  }

  h1 em { color: var(--blue); font-style: normal; }
  h1 u {
    text-decoration: none;
    color: var(--orange);
  }

  .lede {
    margin-top: 34px;
    max-width: 520px;
    font-size: 30px;
    line-height: 1.44;
    color: var(--soft);
  }

  .lede b { color: #FFFFFF; font-weight: 600; }

  /* Signature: gerçek etkinlik verisi şeridi */
  .event-strip {
    margin-top: 46px;
    display: flex;
    align-items: stretch;
    gap: 0;
    align-self: flex-start;
    border: 1.5px solid rgba(255, 255, 255, 0.16);
    border-radius: 22px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.045);
  }

  .cell {
    padding: 22px 30px;
    border-right: 1.5px solid rgba(255, 255, 255, 0.13);
  }

  .cell:last-child { border-right: none; }

  .cell-label {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: #6B7C96;
  }

  .cell-value {
    margin-top: 8px;
    font-size: 27px;
    font-weight: 600;
    color: #FFFFFF;
    letter-spacing: -0.01em;
  }

  .cell-value.accent { color: var(--orange); }

  .cta {
    margin-top: auto;
    display: inline-flex;
    align-items: center;
    gap: 18px;
    align-self: flex-start;
    padding: 25px 44px;
    border-radius: 999px;
    background: var(--blue);
    color: #FFFFFF;
    font-size: 31px;
    font-weight: 700;
    letter-spacing: -0.01em;
    box-shadow: 0 20px 46px rgba(3, 112, 251, 0.42);
  }

  .cta svg { width: 30px; height: 30px; }

  .footer {
    margin-top: 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 23px;
    color: #61708A;
    font-weight: 500;
  }

  .footer .tag { color: var(--blue); font-weight: 600; }

  .device {
    position: absolute;
    right: 92px;
    bottom: 178px;
    width: 366px;
    border-radius: 44px;
    overflow: hidden;
    background: #000;
    border: 9px solid #10141B;
    box-shadow: 0 54px 100px rgba(0, 0, 0, 0.62);
    z-index: 2;
  }

  .device img { width: 100%; display: block; }

  /* Signature: telefonun tepesindeki konum pini */
  .pin-drop {
    position: absolute;
    right: 236px;
    bottom: 936px;
    z-index: 4;
    display: grid;
    place-items: center;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 0 0 12px rgba(3, 112, 251, 0.20),
                0 0 0 26px rgba(3, 112, 251, 0.10),
                0 20px 40px rgba(0, 0, 0, 0.5);
  }

  .pin-drop svg { width: 42px; height: 42px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="rings">
    <div class="r1"></div><div class="r2"></div>
    <div class="r3"></div><div class="r4"></div>
  </div>
  {{PHOTO_BLOCK}}

  <div class="stage">
    <div class="brand">
      <img src="{{LOGO_SRC}}" alt="">
      <div class="brand-name">id<i>e</i>avoll</div>
    </div>

    <div class="kicker">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8FB6FF"
           stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round">
        <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/>
        <circle cx="12" cy="10" r="2.5"/>
      </svg>
      {{KICKER}}
    </div>

    <h1>{{HEADLINE}}</h1>
    <p class="lede">{{LEDE}}</p>

    <div class="event-strip">
      <div class="cell">
        <div class="cell-label">Ne zaman</div>
        <div class="cell-value">{{META_TIME}}</div>
      </div>
      <div class="cell">
        <div class="cell-label">Nerede</div>
        <div class="cell-value">{{META_PLACE}}</div>
      </div>
      <div class="cell">
        <div class="cell-label">Kim var</div>
        <div class="cell-value accent">{{META_PEOPLE}}</div>
      </div>
    </div>

    <div class="cta">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff"
           stroke-width="2.4" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      <span>{{CTA}}</span>
    </div>

    <div class="footer">
      <span>ideavoll.com</span>
      <span class="tag">{{TAG}}</span>
    </div>
  </div>

  <div class="pin-drop">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/>
      <circle cx="12" cy="10" r="2.5"/>
    </svg>
  </div>
  {{DEVICE_BLOCK}}
</body>
</html>
