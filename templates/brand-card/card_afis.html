<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
{{FONT_FACES}}
<style>
  /* K2 — B'nin tam kaplayan afişi, A'nın tipografisi ve veri şeridi.
     ALL CAPS yok: Türkçe'de okunabilirlik için sentence case. */
  :root {
    --blue: #0370FB;
    --orange: #FD7201;
    --bg: #07090D;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    position: relative;
    background: var(--bg);
    color: #FFFFFF;
    font-family: "Inter", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  .scrim {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(
      to top,
      rgba(7, 9, 13, 0.96) 26%,
      rgba(7, 9, 13, 0.55) 52%,
      rgba(7, 9, 13, 0.10) 74%,
      rgba(7, 9, 13, 0.50) 100%
    );
  }

  /* İmza: konum halkaları, fotoğrafın üstünde ince ışık olarak */
  .rings {
    position: absolute;
    top: 88px;
    right: -260px;
    width: 900px;
    height: 900px;
    z-index: 2;
  }

  .rings div {
    position: absolute;
    border: 1.5px solid rgba(255, 255, 255, 0.34);
    border-radius: 50%;
    inset: 0;
    margin: auto;
  }

  .r1 { width: 210px; height: 210px; }
  .r2 { width: 470px; height: 470px; opacity: 0.74; }
  .r3 { width: 730px; height: 730px; opacity: 0.5; }

  .pin {
    position: absolute;
    top: 500px;
    right: 158px;
    z-index: 3;
    display: grid;
    place-items: center;
    width: 74px;
    height: 74px;
    border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 0 0 11px rgba(3, 112, 251, 0.22),
                0 0 0 24px rgba(3, 112, 251, 0.11);
  }

  .pin svg { width: 38px; height: 38px; }

  .stage {
    position: relative;
    z-index: 4;
    height: 100%;
    padding: 68px 66px 62px;
    display: flex;
    flex-direction: column;
  }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand { display: flex; align-items: center; gap: 15px; }
  .brand img { width: 52px; height: 52px; }

  .brand-name {
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: -0.03em;
  }

  .brand-name i { color: var(--orange); font-style: normal; }

  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 11px 20px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(8px);
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.005em;
  }

  h1 {
    margin-top: auto;
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 124px;
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: -0.05em;
    text-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
  }

  h1 em { color: var(--orange); font-style: normal; }

  .lede {
    margin-top: 30px;
    max-width: 700px;
    font-size: 30px;
    line-height: 1.42;
    color: rgba(255, 255, 255, 0.8);
  }

  .lede b { color: #FFFFFF; font-weight: 600; }

  /* A'dan taşınan veri şeridi — cam yüzey */
  .event-strip {
    margin-top: 42px;
    display: flex;
    align-self: flex-start;
    border: 1.5px solid rgba(255, 255, 255, 0.20);
    border-radius: 22px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.09);
    backdrop-filter: blur(14px);
  }

  .cell {
    padding: 22px 32px;
    border-right: 1.5px solid rgba(255, 255, 255, 0.16);
  }

  .cell:last-child { border-right: none; }

  .cell-label {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.58);
  }

  .cell-value {
    margin-top: 8px;
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 29px;
    font-weight: 700;
    letter-spacing: -0.025em;
  }

  .cell-value.accent { color: var(--orange); }

  .bottom {
    margin-top: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 17px;
    padding: 25px 44px;
    border-radius: 999px;
    background: var(--blue);
    font-size: 31px;
    font-weight: 700;
    letter-spacing: -0.01em;
    box-shadow: 0 20px 46px rgba(3, 112, 251, 0.45);
  }

  .cta svg { width: 29px; height: 29px; }

  .handle {
    font-size: 23px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.62);
  }

  /* --- Format varyantları --------------------------------------- */
  body[data-format="story"] { height: 1920px; }
  body[data-format="square"] { height: 1080px; }

  /* Story: Instagram üst/alt arayüzü için güvenli alan bırakılır */
  body[data-format="story"] .stage { padding: 196px 66px 232px; }
  body[data-format="story"] h1 { font-size: 132px; }
  body[data-format="story"] .rings { top: 330px; }
  body[data-format="story"] .pin { top: 742px; }

  body[data-format="square"] .stage { padding: 54px 58px 52px; }
  body[data-format="square"] h1 { font-size: 92px; }
  body[data-format="square"] .lede { margin-top: 22px; font-size: 27px; }
  body[data-format="square"] .event-strip { margin-top: 28px; }
  body[data-format="square"] .cell { padding: 17px 26px; }
  body[data-format="square"] .cell-value { font-size: 26px; }
  body[data-format="square"] .bottom { margin-top: 30px; }
  body[data-format="square"] .rings { top: 24px; width: 720px;
                                       height: 720px; right: -220px; }
  body[data-format="square"] .pin { top: 344px; right: 138px; }
</style>
</head>
<body data-format="{{FORMAT}}">
  {{PHOTO_BLOCK}}
  <div class="scrim"></div>
  <div class="rings">
    <div class="r1"></div><div class="r2"></div><div class="r3"></div>
  </div>
  <div class="pin">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/>
      <circle cx="12" cy="10" r="2.5"/>
    </svg>
  </div>

  <div class="stage">
    <div class="top">
      <div class="brand">
        <img src="{{LOGO_SRC}}" alt="">
        <div class="brand-name">id<i>e</i>avoll</div>
      </div>
      <div class="kicker">{{KICKER}}</div>
    </div>

    <h1>{{HEADLINE}}</h1>
    <p class="lede">{{LEDE}}</p>

    <div class="event-strip">
      <div class="cell">
        <div class="cell-label">Ne zaman</div>
        <div class="cell-value">{{META_TIME}}</div>
      </div>
      <div class="cell">
        <div class="cell-label">Nerede</div>
        <div class="cell-value">{{META_PLACE}}</div>
      </div>
      <div class="cell">
        <div class="cell-label">Kim var</div>
        <div class="cell-value accent">{{META_PEOPLE}}</div>
      </div>
    </div>

    <div class="bottom">
      <div class="cta">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff"
             stroke-width="2.4" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        <span>{{CTA}}</span>
      </div>
      <div class="handle">ideavoll.com</div>
    </div>
  </div>
</body>
</html>
