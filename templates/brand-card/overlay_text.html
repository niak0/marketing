<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
{{FONT_FACES}}
<style>
  :root {
    --blue: #0370FB;
    --orange: #FD7201;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1920px;
    background: transparent;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0 74px 780px;
  }

  h1 {
    font-family: "Bricolage Grotesque", sans-serif;
    color: #FFFFFF;
    font-size: 108px;
    font-weight: 800;
    line-height: 0.98;
    letter-spacing: -0.04em;
    text-shadow: 0 10px 50px rgba(0, 0, 0, 0.65),
                 0 2px 10px rgba(0, 0, 0, 0.55);
  }

  h1 em { color: var(--orange); font-style: normal; }
</style>
</head>
<body>
  <div class="stage">
    <h1>{{HEADLINE}}</h1>
  </div>
</body>
</html>
