<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
{{FONT_FACES}}
<style>
  /* Carousel slaytı. Tek şablon, üç rol: hook / step / cta.
     Rol body[data-role] ile seçilir. */
  :root {
    --blue: #0370FB;
    --orange: #FD7201;
    --ink: #FFFFFF;
    --soft: #93A1B8;
    --bg: #060E1C;
    --ring: rgba(3, 112, 251, 0.42);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    position: relative;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .rings {
    position: absolute;
    bottom: -520px;
    left: 50%;
    transform: translateX(-50%);
    width: 1500px;
    height: 1500px;
    z-index: 0;
  }

  .rings div {
    position: absolute;
    border: 1.5px solid var(--ring);
    border-radius: 50%;
    inset: 0;
    margin: auto;
  }

  .r1 { width: 420px; height: 420px; }
  .r2 { width: 780px; height: 780px; opacity: 0.66; }
  .r3 { width: 1140px; height: 1140px; opacity: 0.4; }
  .r4 { width: 1480px; height: 1480px; opacity: 0.2; }

  .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  .scrim {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(
      to top,
      rgba(6, 14, 28, 0.96) 26%,
      rgba(6, 14, 28, 0.58) 54%,
      rgba(6, 14, 28, 0.14) 76%,
      rgba(6, 14, 28, 0.52) 100%
    );
  }

  .stage {
    position: relative;
    z-index: 4;
    height: 100%;
    padding: 72px 70px 64px;
    display: flex;
    flex-direction: column;
  }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand { display: flex; align-items: center; gap: 15px; }
  .brand img { width: 52px; height: 52px; }

  .brand-name {
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: -0.03em;
  }

  .brand-name i { color: var(--orange); font-style: normal; }

  .counter {
    font-family: "JetBrains Mono", monospace;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--soft);
    border: 1.5px solid rgba(255, 255, 255, 0.20);
    border-radius: 999px;
    padding: 9px 20px;
  }

  /* Adım rozeti — sadece step slaytlarında */
  .step-badge {
    display: none;
    width: 92px;
    height: 92px;
    border-radius: 28px;
    background: var(--blue);
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 48px;
    font-weight: 800;
    place-items: center;
    box-shadow: 0 18px 40px rgba(3, 112, 251, 0.42);
  }

  h1 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    line-height: 0.94;
    letter-spacing: -0.045em;
  }

  h1 em { color: var(--orange); font-style: normal; }

  .lede {
    color: var(--soft);
    line-height: 1.44;
  }

  .lede b { color: #FFFFFF; font-weight: 600; }

  .device {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: -96px;
    width: 452px;
    border-radius: 52px;
    overflow: hidden;
    background: #000;
    border: 10px solid #10141B;
    box-shadow: 0 -30px 90px rgba(0, 0, 0, 0.6);
    z-index: 3;
  }

  .device img { width: 100%; display: block; }

  .swipe {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 25px;
    font-weight: 600;
    color: var(--soft);
  }

  .swipe svg { width: 27px; height: 27px; }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    align-self: flex-start;
    padding: 26px 46px;
    border-radius: 999px;
    background: var(--blue);
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.01em;
    box-shadow: 0 20px 46px rgba(3, 112, 251, 0.45);
  }

  .cta svg { width: 30px; height: 30px; }

  .handle { font-size: 23px; color: #61708A; font-weight: 500; }

  /* --- Rol: hook (ilk slayt) ------------------------------------ */
  body[data-role="hook"] h1 {
    margin-top: auto;
    font-size: 126px;
    text-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
  }

  body[data-role="hook"] .lede {
    margin-top: 30px;
    max-width: 720px;
    font-size: 31px;
  }

  body[data-role="hook"] .swipe { margin-top: 46px; }

  /* --- Rol: step (adım slaytları) ------------------------------- */
  body[data-role="step"] .step-badge {
    display: grid;
    margin-top: 78px;
  }

  body[data-role="step"] h1 {
    margin-top: 30px;
    font-size: 82px;
    max-width: 800px;
  }

  body[data-role="step"] .lede {
    margin-top: 24px;
    max-width: 660px;
    font-size: 30px;
  }

  /* --- Rol: cta (son slayt) ------------------------------------- */
  body[data-role="cta"] .stage { justify-content: center; }

  body[data-role="cta"] .top {
    position: absolute;
    top: 72px;
    left: 70px;
    right: 70px;
  }

  body[data-role="cta"] h1 {
    font-size: 112px;
    max-width: 820px;
  }

  body[data-role="cta"] .lede {
    margin-top: 28px;
    max-width: 640px;
    font-size: 30px;
  }

  body[data-role="cta"] .cta { margin-top: 52px; }

  body[data-role="cta"] .bottom {
    margin-top: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
</style>
</head>
<body data-role="{{ROLE}}">
  {{PHOTO_BLOCK}}
  <div class="scrim"></div>
  <div class="rings">
    <div class="r1"></div><div class="r2"></div>
    <div class="r3"></div><div class="r4"></div>
  </div>
  {{DEVICE_BLOCK}}

  <div class="stage">
    <div class="top">
      <div class="brand">
        <img src="{{LOGO_SRC}}" alt="">
        <div class="brand-name">id<i>e</i>avoll</div>
      </div>
      <div class="counter">{{COUNTER}}</div>
    </div>

    <div class="step-badge">{{STEP}}</div>

    <h1>{{HEADLINE}}</h1>
    <p class="lede">{{LEDE}}</p>

    {{TAIL}}
  </div>
</body>
</html>
