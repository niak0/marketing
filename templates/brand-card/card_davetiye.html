<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
{{FONT_FACES}}
<style>
  /* K1 — A'nın gece zemini + halkaları, C'nin bilet objesi */
  :root {
    --blue: #0370FB;
    --orange: #FD7201;
    --ink: #FFFFFF;
    --soft: #93A1B8;
    --bg: #060E1C;
    --ring: rgba(3, 112, 251, 0.42);
    --card: #101B30;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    position: relative;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .rings {
    position: absolute;
    bottom: -420px;
    left: 50%;
    transform: translateX(-50%);
    width: 1500px;
    height: 1500px;
    z-index: 0;
  }

  .rings div {
    position: absolute;
    border: 1.5px solid var(--ring);
    border-radius: 50%;
    inset: 0;
    margin: auto;
  }

  .r1 { width: 420px; height: 420px; }
  .r2 { width: 780px; height: 780px; opacity: 0.66; }
  .r3 { width: 1140px; height: 1140px; opacity: 0.40; }
  .r4 { width: 1480px; height: 1480px; opacity: 0.20; }

  .glow {
    position: absolute;
    bottom: -340px;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 900px;
    border-radius: 50%;
    background: radial-gradient(
      circle,
      rgba(3, 112, 251, 0.26) 0%,
      transparent 68%
    );
    z-index: 0;
  }

  .photo {
    position: absolute;
    top: 0;
    right: 0;
    width: 760px;
    height: 620px;
    object-fit: cover;
    z-index: 1;
    opacity: 0.85;
    -webkit-mask-image:
      radial-gradient(118% 118% at 100% 0%, #000 30%, transparent 76%),
      linear-gradient(to right, transparent 0%, #000 30%);
    -webkit-mask-composite: source-in;
    mask-composite: intersect;
  }

  .stage {
    position: relative;
    z-index: 3;
    height: 100%;
    padding: 74px 74px 62px;
    display: flex;
    flex-direction: column;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand img { width: 54px; height: 54px; }

  .brand-name {
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.03em;
  }

  .brand-name i { color: var(--orange); font-style: normal; }

  .kicker {
    margin-top: 86px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    align-self: flex-start;
    padding: 12px 22px 12px 16px;
    border: 1.5px solid rgba(3, 112, 251, 0.55);
    border-radius: 999px;
    font-size: 23px;
    font-weight: 600;
    color: #BFD4FF;
    background: rgba(3, 112, 251, 0.10);
  }

  .kicker svg { width: 22px; height: 22px; }

  h1 {
    margin-top: 28px;
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 104px;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.045em;
    max-width: 660px;
  }

  h1 em { color: var(--blue); font-style: normal; }

  .lede {
    margin-top: 30px;
    max-width: 560px;
    font-size: 29px;
    line-height: 1.44;
    color: var(--soft);
  }

  .lede b { color: #FFFFFF; font-weight: 600; }

  /* C'den taşınan bilet objesi — gece sürümü */
  .ticket {
    margin-top: 52px;
    position: relative;
    display: flex;
    background: var(--card);
    border: 1.5px solid rgba(255, 255, 255, 0.10);
    border-radius: 26px;
    overflow: hidden;
    box-shadow: 0 34px 70px rgba(0, 0, 0, 0.55);
  }

  .ticket-photo {
    width: 250px;
    flex: 0 0 250px;
    object-fit: cover;
  }

  .ticket-body {
    flex: 1;
    padding: 32px 36px;
  }

  .perf {
    position: absolute;
    left: 250px;
    top: 0;
    bottom: 0;
    width: 2px;
    background-image: linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.26) 0 12px,
      transparent 12px 26px
    );
    background-size: 2px 26px;
    z-index: 3;
  }

  .perf::before, .perf::after {
    content: "";
    position: absolute;
    left: -14px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bg);
  }

  .perf::before { top: -14px; }
  .perf::after { bottom: -14px; }

  .ticket-kicker {
    font-family: "JetBrains Mono", monospace;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--orange);
  }

  .ticket-title {
    margin-top: 10px;
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -0.035em;
  }

  .ticket-rows {
    margin-top: 22px;
    display: grid;
    gap: 12px;
  }

  .row {
    display: flex;
    align-items: baseline;
    gap: 14px;
    font-family: "JetBrains Mono", monospace;
    font-size: 22px;
  }

  .row-key {
    width: 124px;
    flex: 0 0 124px;
    color: #6B7C96;
  }

  .row-dots {
    flex: 1;
    border-bottom: 2px dotted rgba(255, 255, 255, 0.22);
    transform: translateY(-6px);
  }

  .row-val { font-weight: 700; color: #FFFFFF; }
  .row-val.accent { color: var(--orange); }

  .bottom {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    padding: 25px 44px;
    border-radius: 999px;
    background: var(--blue);
    font-size: 31px;
    font-weight: 700;
    letter-spacing: -0.01em;
    box-shadow: 0 20px 46px rgba(3, 112, 251, 0.42);
  }

  .cta svg { width: 30px; height: 30px; }

  .handle { font-size: 23px; color: #61708A; font-weight: 500; }

  /* --- Format varyantları --------------------------------------- */
  body[data-format="story"] { height: 1920px; }
  body[data-format="square"] { height: 1080px; }

  body[data-format="story"] .stage { padding: 200px 74px 244px; }
  body[data-format="story"] h1 { font-size: 116px; }
  body[data-format="story"] .photo { height: 760px; }
  body[data-format="story"] .kicker { margin-top: 70px; }
  body[data-format="story"] .ticket { margin-top: 70px; }

  body[data-format="square"] .stage { padding: 54px 58px 50px; }
  body[data-format="square"] .kicker { margin-top: 34px; }
  body[data-format="square"] h1 { font-size: 78px; }
  body[data-format="square"] .lede { display: none; }
  body[data-format="square"] .ticket { margin-top: 30px; }
  body[data-format="square"] .ticket-body { padding: 22px 28px; }
  body[data-format="square"] .ticket-title { font-size: 36px; }
  body[data-format="square"] .ticket-rows { margin-top: 16px; gap: 9px; }
  body[data-format="square"] .row { font-size: 20px; }
  body[data-format="square"] .photo { height: 430px; }
</style>
</head>
<body data-format="{{FORMAT}}">
  <div class="glow"></div>
  <div class="rings">
    <div class="r1"></div><div class="r2"></div>
    <div class="r3"></div><div class="r4"></div>
  </div>
  {{PHOTO_BLOCK}}

  <div class="stage">
    <div class="brand">
      <img src="{{LOGO_SRC}}" alt="">
      <div class="brand-name">id<i>e</i>avoll</div>
    </div>

    <div class="kicker">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8FB6FF"
           stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round">
        <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/>
        <circle cx="12" cy="10" r="2.5"/>
      </svg>
      {{KICKER}}
    </div>

    <h1>{{HEADLINE}}</h1>
    <p class="lede">{{LEDE}}</p>

    <div class="ticket">
      {{TICKET_PHOTO}}
      <div class="perf"></div>
      <div class="ticket-body">
        <div class="ticket-kicker">Yeni etkinlik</div>
        <div class="ticket-title">{{EVENT_NAME}}</div>
        <div class="ticket-rows">
          <div class="row">
            <span class="row-key">ne zaman</span>
            <span class="row-dots"></span>
            <span class="row-val">{{META_TIME}}</span>
          </div>
          <div class="row">
            <span class="row-key">nerede</span>
            <span class="row-dots"></span>
            <span class="row-val">{{META_PLACE}}</span>
          </div>
          <div class="row">
            <span class="row-key">kim var</span>
            <span class="row-dots"></span>
            <span class="row-val accent">{{META_PEOPLE}}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom">
      <div class="cta">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff"
             stroke-width="2.4" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        <span>{{CTA}}</span>
      </div>
      <div class="handle">ideavoll.com</div>
    </div>
  </div>
</body>
</html>
