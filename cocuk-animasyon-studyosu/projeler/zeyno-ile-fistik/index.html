<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">

<style>

  :root { --bg: #1d2333; --fg: #f4f6ff; --btn: #5A78FF; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #eef2ff; --fg: #1d2333; } }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 16px; box-sizing: border-box; }
  svg#stage { width: 100%; height: auto; display: block; border-radius: 18px; background: #8fd3ff; }
  .bar { display: flex; gap: 12px; align-items: center; margin-top: 12px; }

  input[type=range] { flex: 1; accent-color: var(--btn); }
  body.record .wrap { padding: 0; max-width: none; }
  body.record svg#stage { border-radius: 0; }
  body.record .bar { display: none; }
  text { font-family: "Story", system-ui, sans-serif; }
</style>
</head>
<body>

<svg id="stage" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">

      <g fill="#c9772f"><circle cx="-40" cy="-150" r="11"/><circle cx="-8" cy="-130" r="9"/><circle cx="22" cy="-156" r="10"/><circle cx="-52" cy="-124" r="7"/><circle cx="44" cy="-132" r="7"/></g>
      <rect id="g-leg-br" x="-36" y="-128" width="17" height="128" rx="8" fill="#f8c849"/>

        <rect x="46" y="-345" width="34" height="200" rx="16" fill="#f8c849"/>
        <g fill="#c9772f"><circle cx="62" cy="-200" r="8"/><circle cx="66" cy="-260" r="7"/><circle cx="60" cy="-310" r="6"/></g>
        <g id="g-head">

          <circle cx="60" cy="-400" r="7" fill="#8a5a3c"/><circle cx="80" cy="-402" r="7" fill="#8a5a3c"/>
          <ellipse cx="46" cy="-362" rx="16" ry="8" fill="#f8c849" transform="rotate(-25 46 -362)"/>

          <ellipse cx="118" cy="-344" rx="18" ry="15" fill="#f3b23a"/>
          <circle cx="124" cy="-348" r="3" fill="#6b4a33"/>
          <circle cx="84" cy="-362" r="7" fill="#2b2b2b"/><circle cx="86" cy="-364" r="2.4" fill="#fff"/>
          <ellipse cx="96" cy="-340" rx="8" ry="5" fill="#ff9fb0" opacity=".8"/>

        </g>
      </g>

  <g id="ball"><circle r="22" fill="#ff5e5e"/><path d="M-22 0 A22 22 0 0 0 22 0" fill="#fff"/><path d="M-6 -22 Q8 0 -6 22" stroke="#5A78FF" stroke-width="5" fill="none"/></g>

  <g id="elephantWrap">

        <circle cx="72" cy="-110" r="6.5" fill="#2b2b2b"/><circle cx="74" cy="-112" r="2.2" fill="#fff"/>

      <!-- tiny bow -->

  <g id="water" fill="#3d8bff" stroke="#fff" stroke-width="2"></g>

  <!-- caption -->

    <rect x="140" y="22" width="1000" height="70" rx="35" fill="#22264a" opacity=".82"/>
    <text x="640" y="68" text-anchor="middle" font-size="32" font-weight="700" fill="#fff"></text>
  </g>

  <g id="title" opacity="0">
    <text x="640" y="320" text-anchor="middle" font-size="110" font-weight="800" fill="#fff" stroke="#22264a" stroke-width="10" paint-order="stroke">SON</text>
    <text x="640" y="385" text-anchor="middle" font-size="34" font-weight="700" fill="#fff" stroke="#22264a" stroke-width="6" paint-order="stroke">Zeyno ile Fıstık yarın yine parkta!</text>

    <text x="640" y="330" text-anchor="middle" font-size="96" font-weight="800" fill="#fff">Zeyno ile Fıstık</text>
    <text x="640" y="395" text-anchor="middle" font-size="36" font-weight="600" fill="#ffe08a">Parkta Bir Gün</text>

  <rect id="fade" width="1280" height="720" fill="#000" opacity="0" pointer-events="none"/>
</svg>
<div class="bar"><button id="play">Duraklat</button><input id="seek" type="range" min="0" max="34" step="0.01" value="0"></div>
</div>

<script>
const DUR = 34;
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const ease = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const seg = (t, a, b) => ease(clamp((t - a) / (b - a)));
const win = (t, a, b, f = .25) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b)); // fade in/out window
const S = (el, k, v) => el.setAttribute(k, v);
const show = (el, o) => { el.style.display = o > 0.001 ? '' : 'none'; el.setAttribute('opacity', o); };

// trees along the road
const TREE_GAP = 300;
const roadTrees = $('roadTrees');
for (let i = 0; i < 7; i++) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  const big = i % 2 === 0;
  g.innerHTML = big
    ? '<rect x="-10" y="-120" width="20" height="120" fill="#8a5a3c"/><circle cy="-150" r="62" fill="#4fa63f"/><circle cx="-38" cy="-118" r="40" fill="#5cb84a"/><circle cx="40" cy="-122" r="42" fill="#5cb84a"/>'
    : '<ellipse cx="0" cy="-26" rx="56" ry="34" fill="#5cb84a"/><circle cx="-20" cy="-36" r="6" fill="#ff6b8a"/><circle cx="18" cy="-28" r="6" fill="#ffd84d"/>';
  roadTrees.appendChild(g);
}
const hearts = $('hearts');
for (let i = 0; i < 5; i++) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', 'M0 6 C-14 -6 -8 -18 0 -10 C8 -18 14 -6 0 6 Z');
  hearts.appendChild(p);
}
const water = $('water');
for (let i = 0; i < 26; i++) {
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('r', 5 + (i % 3) * 2);
  water.appendChild(c);
}

// ---------- characters ----------
function pose(prefix, legNames, swing, ox, oy) {
  legNames.forEach(([n, x, y, ph]) => S($(prefix + n), 'transform', `rotate(${swing * ph} ${x} ${y})`));
}
function giraffe({ x, y = 620, dir = 1, s = 1, walk = 0, neck = 0, head = 0, op = 1, bob = 0 }) {
  const w = Math.sin(walk);
  pose('g-leg-', [['bl', -47, -126, 1], ['fr', 58, -126, 1], ['br', -27, -126, -1], ['fl', 38, -126, -1]], w * 18);
  S($('g-neck'), 'transform', `rotate(${neck} 62 -160)`);
  S($('g-head'), 'transform', `rotate(${head} 70 -350)`);
  S($('g-tail'), 'transform', `rotate(${Math.sin(walk * 0.7 + 1) * 12} -72 -150)`);
  const by = walk ? -Math.abs(Math.cos(walk)) * 5 : 0;
  S($('giraffe'), 'transform', `translate(0 ${by + bob})`);
  S($('giraffeWrap'), 'transform', `translate(${x} ${y}) scale(${s * dir} ${s})`);
  show($('giraffeWrap'), op);
}
function elephant({ x, y = 620, dir = 1, s = 1, walk = 0, trunk = 0, ear = 0, rot = 0, op = 1, bob = 0 }) {
  const w = Math.sin(walk);
  pose('e-leg-', [['bl', -34, -50, 1], ['fr', 42, -50, 1], ['br', -14, -50, -1], ['fl', 22, -50, -1]], w * 22);
  S($('e-trunk'), 'transform', `rotate(${trunk} 88 -94)`);
  S($('e-ear'), 'transform', `rotate(${ear} 50 -110)`);
  const by = walk ? -Math.abs(Math.cos(walk)) * 6 : 0;
  S($('elephant'), 'transform', `translate(0 ${by + bob})`);
  S($('elephantWrap'), 'transform', `translate(${x} ${y}) rotate(${rot}) scale(${s * dir} ${s})`);
  show($('elephantWrap'), op);
}
function bubble(id, txt, x, y, o, tailDir = 1) {
  const g = $(id), r = g.querySelector('rect'), t = g.querySelector('text'), tail = g.querySelector('.tail');
  if (t.textContent !== txt) t.textContent = txt;
  const w = (txt ? t.getComputedTextLength() : 0) + 44, h = 58;
  const pop = 0.85 + 0.15 * clamp(o * 1.5);
  S(r, 'x', -w / 2); S(r, 'y', -h); S(r, 'width', w); S(r, 'height', h);
  S(t, 'x', 0); S(t, 'y', -h / 2 + 10);
  S(tail, 'd', `M${-12 * tailDir} -3 L${-26 * tailDir} 24 L${14 * tailDir} -3`);
  S(g, 'transform', `translate(${x} ${y}) scale(${pop})`);
  show(g, o);
}
function caption(txt, o) {
  const g = $('caption'), t = g.querySelector('text');
  if (t.textContent !== txt) t.textContent = txt;
  show(g, o);
}

// ---------- scenes ----------
const SCENES = [0, 6, 11, 17, 23, 29, DUR];
const CAPS = [
  'Zürafa Zeyno ile fil yavrusu Fıstık komşuydu.',
  'Bir sabah birlikte parka doğru yola çıktılar.',
  'Önce salıncakta sallandılar. Wiiii!',
  'Sonra Fıstık kaydıraktan kaydı!',
  'Top oynadılar, Fıstık hortumuyla gökkuşağı yaptı!',
  'Akşam olunca evlerine döndüler.',
];

function render(t) {
  t = clamp(t, 0, DUR - 0.001);
  let sc = 0; while (t >= SCENES[sc + 1]) sc++;
  const a = SCENES[sc], b = SCENES[sc + 1], lt = t - a;

  // fade between scenes
  let f = 0;
  if (sc > 0) f = Math.max(f, 1 - clamp(lt / 0.45));
  if (sc < SCENES.length - 2) f = Math.max(f, clamp((t - (b - 0.45)) / 0.45));
  if (sc === SCENES.length - 2) f = Math.max(f, clamp((t - (DUR - 0.6)) / 0.6) * 0.6);
  S($('fade'), 'opacity', f);

  // sky / sun / clouds
  const dusk = sc === 5 ? seg(lt, 0, 3) : 0;
  S($('dusk'), 'opacity', dusk);
  S($('sun'), 'transform', `translate(${lerp(1080, 1120, dusk)} ${lerp(130, 470, dusk)})`);
  document.querySelectorAll('.cloud').forEach((c, i) => {
    const x = ((+c.dataset.x + t * (10 + i * 4)) % 1500) - 100;
    S(c, 'transform', `translate(${x} ${c.dataset.y}) scale(${c.dataset.s})`);
  });

  ['houses', 'road', 'swingSet', 'slideSet', 'openPark', 'rainbow', 'ball', 'puff', 'title', 'intro', 'butterfly', 'hearts', 'water'].forEach(id => show($(id), 0));
  show($('hills'), 1);
  let bA = ['', 0, 0, 0, 1], bB = ['', 0, 0, 0, 1];
  caption(CAPS[sc], win(lt, 0.5, b - a - 0.3, 0.35));

  if (sc === 0) {
    show($('houses'), 1);
    show($('intro'), 1 - seg(t, 1.6, 2.3));
    const smk = $('smoke').children;
    for (let i = 0; i < 3; i++) { const u = (t * 0.6 + i / 3) % 1; S(smk[i], 'cx', 393 + Math.sin(u * 6) * 8); S(smk[i], 'cy', 100 - u * 70); S(smk[i], 'opacity', 1 - u); }
    const wg = seg(t, 1.8, 3.6), we = seg(t, 2.0, 3.8);
    const wave = seg(t, 3.8, 4.2);
    giraffe({ x: lerp(335, 540, wg), dir: 1, walk: (wg > 0 && wg < 1) ? t * 9 : 0, op: seg(t, 1.6, 2.0), neck: wave * Math.sin(t * 6) * 6, head: wave * 8 });
    elephant({ x: lerp(960, 760, we), dir: -1, walk: (we > 0 && we < 1) ? t * 10 : 0, op: seg(t, 1.8, 2.2), trunk: -seg(t, 3.8, 4.3) * 110 + Math.sin(t * 8) * 8 * wave, ear: Math.sin(t * 7) * 10 * wave });
    bA = ['Günaydın Fıstık!', 600, 245, win(t, 3.9, 5.0), 1];
    bB = ['Günaydın! Parka gidelim mi?', 800, 470, win(t, 4.9, 6.0), -1];
  }

  if (sc === 1) {
    show($('road'), 1);
    const scroll = lt * 190;
    [...$('roadTrees').children].forEach((g, i) => {
      const x = ((i * TREE_GAP - scroll) % (TREE_GAP * 7) + TREE_GAP * 7) % (TREE_GAP * 7) - 200;
      S(g, 'transform', `translate(${x} ${i % 2 ? 612 : 600})`);
    });
    S($('parkSign'), 'transform', `translate(${lerp(1500, 1000, seg(lt, 2.2, 4.8))} 612)`);
    giraffe({ x: 470, y: 625, dir: 1, walk: t * 8, neck: Math.sin(t * 2) * 3 });
    elephant({ x: 680, y: 640, dir: 1, walk: t * 10, trunk: Math.sin(t * 3) * 10, ear: Math.sin(t * 10) * 4 });
    show($('butterfly'), 1);
    S($('butterfly'), 'transform', `translate(${lerp(900, 560, lt / 5)} ${300 + Math.sin(t * 3) * 40}) scale(${Math.abs(Math.sin(t * 18)) * 0.7 + 0.3} 1)`);
    bB = ['Yaşasın, park!', 760, 460, win(lt, 3.4, 4.8), 1];
  }

  if (sc === 2) {
    show($('swingSet'), 1);
    const amp = 28 * seg(lt, 0.3, 1.5);
    const ang = amp * Math.sin(lt * 2.6);
    S($('swing'), 'transform', `translate(760 284) rotate(${ang})`);
    // elephant sits on swing seat
    const rad = ang * Math.PI / 180;
    const sx = 760 - Math.sin(rad) * 226, sy = 284 + Math.cos(rad) * 226;
    elephant({ x: sx - 6, y: sy + 8, dir: 1, rot: ang, trunk: -40 - Math.sin(lt * 2.6) * 30, ear: Math.sin(lt * 2.6) * 14, s: 0.95 });
    // giraffe pushes with her head when swing comes back
    const push = Math.max(0, -Math.sin(lt * 2.6 + 0.4));
    giraffe({ x: 470, dir: 1, neck: 22 + push * 18, head: 14 });
    bB = ['Wiiii!', 830, 330, win(lt, 2.0, 3.6), -1];
    bA = ['Daha yükseğe!', 380, 175, win(lt, 3.8, 5.6), 1];
  }

  if (sc === 3) {
    show($('slideSet'), 1);
    let ex, ey, rot = 0, dir = -1, walk = 0;
    if (lt < 0.8) { ex = lerp(1080, 910, seg(lt, 0, 0.8)); ey = 620; walk = lt * 10; }
    else if (lt < 2.0) { const u = seg(lt, 0.8, 2.0); ex = 910; ey = lerp(620, 370, u); walk = lt * 12; }
    else if (lt < 2.5) { ex = lerp(910, 860, seg(lt, 2.0, 2.4)); ey = 370; }
    else if (lt < 3.5) {
      const u = clamp((lt - 2.5) / 1.0); const uu = u * u * (3 - 2 * u) * 0.4 + u * 0.6;
      // cubic along slide curve
      const P = [[850, 380], [760, 388], [700, 478], [650, 568]], Q = [[650, 568], [630, 604], [600, 610], [560, 612]];
      const bez = (p, k) => { const m = 1 - k; return [0, 1].map(i => m * m * m * p[0][i] + 3 * m * m * k * p[1][i] + 3 * m * k * k * p[2][i] + k * k * k * p[3][i]); };
      let pt, ang;
      if (uu < 0.8) { const k = uu / 0.8; pt = bez(P, k); const p2 = bez(P, Math.min(1, k + 0.02)); ang = Math.atan2(p2[1] - pt[1], p2[0] - pt[0]); }
      else { const k = (uu - 0.8) / 0.2; pt = bez(Q, k); const p2 = bez(Q, Math.min(1, k + 0.05)); ang = Math.atan2(p2[1] - pt[1], p2[0] - pt[0]); }
      ex = pt[0]; ey = pt[1] - 4; rot = ang * 180 / Math.PI - 180;
      if (rot < -180) rot += 360;
    } else { ex = 560; ey = 625; }
    const landed = lt >= 3.5;
    elephant({ x: ex, y: ey, dir, rot, walk, trunk: landed ? -100 - Math.sin(lt * 9) * 15 : (lt > 2.5 ? -70 : 0), ear: lt > 2.5 ? Math.sin(lt * 12) * 12 : 0, bob: landed ? -Math.abs(Math.sin((lt - 3.5) * 6)) * 14 * (1 - seg(lt, 3.5, 4.6)) : 0 });
    if (lt > 3.4 && lt < 4.4) { show($('puff'), 1 - seg(lt, 3.5, 4.4)); const k = seg(lt, 3.4, 4.4); S($('puff'), 'transform', `translate(560 ${622 - k * 10}) scale(${0.6 + k})`); }
    giraffe({ x: 300, dir: 1, neck: lt > 3.6 ? Math.sin(lt * 7) * 8 : 6, head: lt > 3.6 ? 10 : 4 });
    bA = ['Bravo Fıstık!', 410, 200, win(lt, 3.7, 5.0), 1];
    bB = ['Bir daha!', 600, 470, win(lt, 4.8, 6.0), -1];
  }

  if (sc === 4) {
    show($('openPark'), 1);
    const G = { x: 400 }, E = { x: 860 };
    const head = [G.x + 120, 620 - 350], tip = [E.x - 112, 620 - 190];
    const legs = [[0.6, 1.8, head, tip], [1.8, 3.0, tip, head], [3.0, 4.2, head, tip]];
    let bx = head[0], by = head[1] - 20, ballOn = lt < 4.2;
    let gNeck = 0, eTrunk = 0;
    for (const [s0, s1, p0, p1] of legs) {
      if (lt >= s0 && lt < s1) { const u = (lt - s0) / (s1 - s0); bx = lerp(p0[0], p1[0], u); by = lerp(p0[1], p1[1], u) - 220 * 4 * u * (1 - u) - 20; }
      const near = Math.exp(-Math.pow((lt - s0) * 6, 2));
      if (p0 === head) gNeck += -near * 10; else eTrunk += -near * 1;
    }
    if (lt < 0.6) { const u = seg(lt, 0, 0.6); by = head[1] - 20 - u * 10; }
    if (lt >= 4.2) { const u = clamp((lt - 4.2) / 0.8); bx = lerp(tip[0], tip[0] + 130, u); by = Math.min(608, tip[1] + 300 * u * u - 80 * u); }
    show($('ball'), 1); S($('ball'), 'transform', `translate(${bx} ${by}) rotate(${lt * 400})`);
    // elephant trunk follows the ball when near
    const dB = Math.hypot(bx - tip[0], by - tip[1]);
    const lift = clamp(1 - dB / 300);
    const spray = seg(lt, 4.4, 4.8) * (1 - seg(lt, 5.6, 5.9));
    giraffe({ x: G.x, dir: 1, neck: 10 + gNeck + (lt > 4.6 ? Math.sin(lt * 6) * 4 : 0), head: -6 });
    elephant({ x: E.x, dir: -1, trunk: -Math.min(130, lift * 120 + spray * 130), ear: Math.sin(lt * 10) * 8 * (lift + spray) });
    // water spray from trunk tip, then rainbow
    if (spray > 0) {
      show($('water'), 1);
      const ox = E.x - 109, oy = 464;
      [...water.children].forEach((c, i) => {
        const u = ((lt * 1.4 + i / water.children.length) % 1);
        const vx = -180 - (i % 5) * 50, vy = -420 - (i % 4) * 40;
        S(c, 'cx', ox + vx * u); S(c, 'cy', oy + vy * u + 520 * u * u);
        S(c, 'opacity', (1 - u) * spray);
      });
    }
    const rb = seg(lt, 4.8, 5.8);
    if (rb > 0) { show($('rainbow'), rb); }
    bB = ['Bak, gökkuşağı!', 800, 400, win(lt, 4.9, 5.9), -1];
  }

  if (sc === 5) {
    show($('houses'), 1);
    const smk = $('smoke').children;
    for (let i = 0; i < 3; i++) { const u = (t * 0.6 + i / 3) % 1; S(smk[i], 'cx', 393 + Math.sin(u * 6) * 8); S(smk[i], 'cy', 100 - u * 70); S(smk[i], 'opacity', 1 - u); }
    const lights = seg(lt, 2.4, 3.2);
    document.querySelectorAll('.win').forEach(w => S(w, 'fill', lights > 0.5 ? '#ffe27a' : '#bfe8ff'));
    const wg = seg(lt, 1.8, 3.4), we = seg(lt, 1.8, 3.4);
    giraffe({ x: lerp(540, 335, wg), dir: wg > 0 && wg < 1 ? -1 : 1, walk: wg > 0 && wg < 1 ? t * 9 : 0, op: 1 - seg(lt, 3.4, 3.9), neck: lt < 1.8 ? Math.sin(t * 4) * 4 : 0 });
    elephant({ x: lerp(760, 960, we), dir: we > 0 && we < 1 ? 1 : -1, walk: we > 0 && we < 1 ? t * 10 : 0, op: 1 - seg(lt, 3.4, 3.9), trunk: lt < 1.8 ? -60 : 0 });
    bB = ['Yarın yine oynayalım mı?', 820, 470, win(lt, 0.2, 1.2), -1];
    bA = ['Olur! İyi geceler!', 600, 245, win(lt, 1.0, 1.9), 1];
    if (lt < 1.9) {
      show($('hearts'), win(lt, 0.4, 1.9));
      [...hearts.children].forEach((h, i) => { const u = (lt * 0.7 + i / 5) % 1; S(h, 'transform', `translate(${650 + Math.sin(u * 8 + i) * 30} ${430 - u * 160}) scale(${1 + u})`); S(h, 'opacity', 1 - u); });
    }
    show($('title'), seg(lt, 3.8, 4.4));
  } else {
    document.querySelectorAll('.win').forEach(w => S(w, 'fill', '#bfe8ff'));
  }

  bubble('bubbleA', ...bA);
  bubble('bubbleB', ...bB);
  $('seek').value = t;
}
window.render = render;
window.DUR = DUR;

// ---------- player ----------
const record = new URLSearchParams(location.search).has('record');
if (record) document.body.classList.add('record');
let playing = !record, t0 = performance.now(), tPaused = 0;
function tick(now) {
  if (playing) { let t = (now - t0) / 1000; if (t >= DUR) { t0 = now; t = 0; } render(t); }
  requestAnimationFrame(tick);
}
$('play').onclick = () => {
  playing = !playing;
  if (playing) t0 = performance.now() - (+$('seek').value) * 1000;
  $('play').textContent = playing ? 'Duraklat' : 'Oynat';
};
$('seek').oninput = e => { playing = false; $('play').textContent = 'Oynat'; render(+e.target.value); };
document.fonts.ready.then(() => { render(0); if (!record) requestAnimationFrame(tick); });
</script>
</body>
</html>
